# Modern UW-IT ACA pattern based on the current Compass-style workflow.
# Deployment is intentionally gated to merge branches only; local development
# branches can continue working without triggering cluster deployment.
---
name: Build, Test and Deploy

env:
  RELEASE_NAME: dawgpath-data-pipeline
  DJANGO_APP: dawgpath_data_pipeline

on:
  push:
    branches: [main, master, qa, develop]
  pull_request:
    branches: [main, master, qa, develop]
    types: [opened, reopened, synchronize]

jobs:
  context:
    runs-on: ubuntu-24.04
    outputs:
      commit_hash: ${{ steps.context.outputs.commit_hash }}
      git_repo_branch: ${{ steps.context.outputs.git_repo_branch }}
      image_tag: ${{ steps.context.outputs.image_tag }}
    steps:
      - name: Set up Context
        id: context
        uses: uw-it-aca/actions/cicd-context@main
        with:
          release_name: ${{ env.RELEASE_NAME }}

  build:
    runs-on: ubuntu-24.04
    needs: context

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install ruff coverage

      - name: Run Python Linters
        uses: uw-it-aca/actions/python-linters@main
        with:
          app_name: ${{ env.DJANGO_APP }}
          exclude_paths: migrations
          ignore: BLE001,S110,RUF012

      - name: Run Python Linters (admin gateway)
        uses: uw-it-aca/actions/python-linters@main
        with:
          app_name: dawgpath_pipeline_admin
          exclude_paths: migrations
          ignore: BLE001,S110,RUF012

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Docker layers
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build App Image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app-container
          tags: ${{ needs.context.outputs.image_tag }}
          push: false
          load: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build Test Image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app-test-container
          tags: app-test-container
          push: false
          load: true

      - name: Run Pipeline Tests
        run: |
          python -m unittest discover -s dawgpath_data_pipeline/tests

      - name: Run Admin Tests
        run: |
          DJANGO_SETTINGS_MODULE=dawgpath_pipeline_admin.test_settings python -m django test dawgpath_pipeline_admin.tests

      - name: Run Tests in Image
        id: tests
        shell: bash
        run: >-
          docker run -u root -t --network ${{ job.container.network }}
          -v ${{ github.workspace }}:/coverage
          -e DJANGO_APP="${{ env.DJANGO_APP }}"
          -e "ENV=localdev"
          -e "AUTH=SAML_MOCK"
          app-test-container
          bash -c ". ./docker/test.sh"

      - name: Push Image to Repository
        if: github.event_name == 'push'
        uses: uw-it-aca/actions/gcr-push@main
        with:
          image_tag: ${{ needs.context.outputs.image_tag }}
          gcp_json_key: ${{ secrets.GCP_JSON_KEY }}

  deploy:
    if: github.event_name == 'push'
    needs: [context, build]
    outputs:
      context: ${{ steps.context.outputs.context }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Deployment Pipeline
        if: >-
          contains(fromJSON('["main","master","develop","qa"]'),
          needs.context.outputs.git_repo_branch)
        uses: uw-it-aca/actions/cicd-deploy@main
        with:
          release_name: ${{ env.RELEASE_NAME }}
          commit_hash: ${{ needs.context.outputs.commit_hash }}
          git_repo_branch: ${{ needs.context.outputs.git_repo_branch }}
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}

      - name: Deploy Evaluation Branch
        if: needs.context.outputs.git_repo_branch == 'feature/eval-me'
        uses: uw-it-aca/actions/cicd-deploy@main
        with:
          release_name: ${{ env.RELEASE_NAME }}
          commit_hash: ${{ needs.context.outputs.commit_hash }}
          git_repo_branch: ${{ needs.context.outputs.git_repo_branch }}
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}
          app_instance: eval

      - name: Surface context from executed build step
        id: context
        shell: bash
        run: echo "context=$(<${CONTEXT_FILENAME})" >> $GITHUB_OUTPUT

  housekeeping:
    if: github.event_name == 'push'
    needs: [context, build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - name: House Keeping
        uses: uw-it-aca/actions/cicd-housekeeping@main
        with:
          release_name: ${{ env.RELEASE_NAME }}
          gh_auth_token: ${{ secrets.GH_AUTH_TOKEN }}
          registry_password: ${{ secrets.GCP_JSON_KEY }}
          context: ${{ needs.deploy.outputs.context }}
