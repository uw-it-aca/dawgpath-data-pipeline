# DawgPath Data Pipeline deployment values for test environment.
# Rendered by CI through uw-it-aca/django-production-chart.
#
# The main deployment is the SAML gateway, which reverse-proxies /dagster to a
# Dagster webserver sidecar bound to loopback in the same pod. The dagster-daemon
# workload runs the monthly full refresh and weekly catalog refresh; both ship
# stopped and must be started from the Dagster UI.

repo: dawgpath-data-pipeline
instance: test

namespace:
  enabled: true

image:
  repository: us-west1-docker.pkg.dev/uwit-mci-axdd/dawgpath-images/dawgpath-data-pipeline
  tag: latest

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2

resources:
  limits:
    cpu: 500m
    memory: 768Mi
  requests:
    cpu: 100m
    memory: 256Mi

lifecycle:
  enabled: true
  preStop:
    enabled: true

readiness:
  enabled: true

securityPolicy:
  enabled: true

gateway:
  enabled: true
  hostnames:
    - test-pipeline.dawgpath.uw.edu
  requestTimeouts:
    frontEnd: 90s
    backEnd: 90s

# TODO: confirm the provisioned Cloud SQL instance with platform owners and
# add the matching externalService serviceAddress/servicePort.
database:
  engine: postgres
  name: dawgpath-pipeline-test
  hostname: dawgpath-pipeline-db-service
  secretName: test-pipeline.dawgpath.uw.edu-sql-secrets

gcsCredentials:
  mounted: true
  secretName: test-pipeline.dawgpath.uw.edu-gcs-credentials

certs:
  mounted: true
  certPath: /certs/test-pipeline.dawgpath.uw.edu-uwca.cert
  keyPath: /certs/test-pipeline.dawgpath.uw.edu-uwca.key
  secretName: test-pipeline.dawgpath.uw.edu-uwca-certs

environmentVariables:
  - name: ENV
    value: test
  - name: GCS_BUCKET_NAME
    value: uw-dawgpath-pipeline-artifacts-test

  - name: AUTH
    value: SAML
  - name: SAML_ENTITY_ID
    value: https://test-pipeline.dawgpath.uw.edu/saml2
  - name: SAML_FORCE_AUTHN
    value: "True"
  - name: SP_USE_2FA
    value: "True"
  - name: CLUSTER_CNAME
    value: test-pipeline.dawgpath.uw.edu

  - name: DAGSTER_HOME
    value: /app

  - name: DB_CLASS
    value: postgres
  - name: DB_HOST
    value: dawgpath-pipeline-db-service
  - name: DB_PORT
    value: "5432"
  - name: DB_DATABASE
    value: dawgpath-pipeline-test

  - name: RESTCLIENTS_SWS_DAO_CLASS
    value: Live
  - name: RESTCLIENTS_SWS_VERIFY_HTTPS
    value: "True"
  - name: RESTCLIENTS_SWS_CERT_FILE
    value: /certs/test-pipeline.dawgpath.uw.edu-uwca.cert
  - name: RESTCLIENTS_SWS_KEY_FILE
    value: /certs/test-pipeline.dawgpath.uw.edu-uwca.key

externalSecrets:
  enabled: true
  secrets:
    - name: test-pipeline.dawgpath.uw.edu-secrets
      externalKey: dawgpath/test/secrets
      data:
        - name: django-secret
          property: django-secret
        - name: edw-server
          property: edw-server
        - name: edw-user
          property: edw-user
        - name: edw-password
          property: edw-password
        - name: sws-host
          property: sws-host
        - name: dagster-access-group
          property: dagster-access-group
    - name: test-pipeline.dawgpath.uw.edu-uw-idp-cert
      externalKey: idp-cert
      data:
        - name: uw-idp-cert
          property: cert
    - name: test-pipeline.dawgpath.uw.edu-sql-secrets
      externalKey: dawgpath/shared/sql-secrets
      data:
        - name: username
          property: username
        - name: password
          property: password
    - name: test-pipeline.dawgpath.uw.edu-gcs-credentials
      externalKey: dawgpath/shared/gcs-credentials
      data:
        - name: credentials.json
          property: credentials.json
    - name: test-pipeline.dawgpath.uw.edu-uwca-certs
      externalKey: dawgpath/test/uwca-certs
      data:
        - name: test-pipeline.dawgpath.uw.edu-uwca.cert
          property: test-pipeline.dawgpath.uw.edu-uwca.cert
        - name: test-pipeline.dawgpath.uw.edu-uwca.key
          property: test-pipeline.dawgpath.uw.edu-uwca.key

environmentVariablesSecrets:
  djangoSecret:
    name: DJANGO_SECRET
    secretName: test-pipeline.dawgpath.uw.edu-secrets
    secretKey: django-secret
  edwServer:
    name: EDW_SERVER
    secretName: test-pipeline.dawgpath.uw.edu-secrets
    secretKey: edw-server
  edwUser:
    name: EDW_USER
    secretName: test-pipeline.dawgpath.uw.edu-secrets
    secretKey: edw-user
  edwPassword:
    name: EDW_PASSWORD
    secretName: test-pipeline.dawgpath.uw.edu-secrets
    secretKey: edw-password
  swsHost:
    name: RESTCLIENTS_SWS_HOST
    secretName: test-pipeline.dawgpath.uw.edu-secrets
    secretKey: sws-host
  dagsterAccessGroup:
    name: DAGSTER_ACCESS_GROUP
    secretName: test-pipeline.dawgpath.uw.edu-secrets
    secretKey: dagster-access-group
  samlSPCert:
    name: SP_CERT
    secretName: test-pipeline.dawgpath.uw.edu-uwca-certs
    secretKey: test-pipeline.dawgpath.uw.edu-uwca.cert
  samlIDPCert:
    name: IDP_CERT
    secretName: test-pipeline.dawgpath.uw.edu-uw-idp-cert
    secretKey: uw-idp-cert
  dbUser:
    name: DB_USER
    secretName: test-pipeline.dawgpath.uw.edu-sql-secrets
    secretKey: username
  dbPassword:
    name: DB_PASSWORD
    secretName: test-pipeline.dawgpath.uw.edu-sql-secrets
    secretKey: password

# Durable Dagster run/event storage, replacing the image's local dagster.yaml.
configmaps:
  dagster-instance:
    dagster.yaml: |
      telemetry:
        enabled: false
      storage:
        postgres:
          postgres_db:
            username:
              env: DB_USER
            password:
              env: DB_PASSWORD
            hostname:
              env: DB_HOST
            db_name:
              env: DB_DATABASE
            port: 5432

podVolumes:
  dagster-instance:
    volume:
      configMap:
        name: dagster-instance
    mount:
      mountPath: /app/dagster.yaml
      subPath: dagster.yaml
    containers: [ base, dagster-webserver ]

# Bound to loopback so the SAML gateway in this pod is its only entrance.
sidecarContainers:
  dagster-webserver:
    image: us-west1-docker.pkg.dev/uwit-mci-axdd/dawgpath-images/dawgpath-data-pipeline:latest
    command:
      - "/app/bin/dagster-webserver"
      - "-h"
      - "127.0.0.1"
      - "-p"
      - "3000"
      - "-w"
      - "/app/workspace.yaml"
      - "--path-prefix"
      - "/dagster"
    environmentVariables:
      - name: DAGSTER_HOME
        value: /app
      - name: DB_HOST
        value: dawgpath-pipeline-db-service
      - name: DB_DATABASE
        value: dawgpath-pipeline-test
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: test-pipeline.dawgpath.uw.edu-sql-secrets
            key: username
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: test-pipeline.dawgpath.uw.edu-sql-secrets
            key: password

# Runs execute inside this pod under the default run launcher, so it is sized
# for the heaviest asset (registration refresh) rather than for the daemon.
daemon:
  enabled: true
  daemons:
    - name: dagster-daemon
      replicaCount: 1
      command: ["/app/bin/dagster-daemon"]
      args: ["run"]
      resources:
        limits:
          cpu: 1000m
          memory: 4096Mi
        requests:
          cpu: 250m
          memory: 1024Mi
